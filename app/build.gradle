plugins { id 'com.android.application' }

android {
    namespace 'com.alazzi.grocery'
    compileSdk 35
    defaultConfig { applicationId 'com.alazzi.grocery'; minSdk 23; targetSdk 35; versionCode 100; versionName '1.0.0' }
    buildTypes { release { minifyEnabled false }; debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
}
